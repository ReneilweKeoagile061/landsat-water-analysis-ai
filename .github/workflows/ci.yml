name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: npm ci

      - name: Install Python test deps
        run: pip install -r requirements.txt

      - name: Lint
        run: npm run lint

      - name: Frontend tests
        run: npm run test

      - name: Index and label tests
        run: pytest

      - name: Label-agreement check
        run: python scripts/validate_labels.py

      - name: Generate catalog data
        run: python scripts/generate_catalog_data.py --output-dir public/data/exports

      - name: Build
        run: npm run build
